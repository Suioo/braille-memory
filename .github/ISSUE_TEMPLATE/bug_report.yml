name: 问题反馈
description: 应用出错、界面异常、闪退等（点位 / 规则的错误请用“点位 / 规则错误”模板）
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 你看到了什么，期望是什么
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 「设置 → 关于」里显示的版本
      placeholder: 例如 2.5.4
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Windows
        - Android
        - 其他
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 系统版本与设备
      placeholder: 例如 Windows 11 / Android 15，一加 13
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、录屏等。请不要附上个人信息。
