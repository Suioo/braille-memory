name: 点位 / 规则错误
description: 报告某个符号的点位、某条规则或例词与《国家通用盲文方案》（GF 0019—2018）不符
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        本项目的点位与规则只依据 **GF 0019—2018**。**必须提供标准页码**；没有页码依据的报告无法核实，也不会被采纳。请不要凭记忆提交，也不要上传标准原文 PDF。
  - type: input
    id: target
    attributes:
      label: 符号或规则编号
      description: 例如符号“ian”，或规则 10.2.3，或例词“阅读”
    validations:
      required: true
  - type: input
    id: current
    attributes:
      label: 应用里目前的写法
      description: 点位编号（如 1-3-4）、或应用里显示的内容；也可以贴截图链接
  - type: input
    id: correct
    attributes:
      label: 正确写法
      description: 按标准所写的点位或规则内容
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: 标准页码
      description: GF 0019—2018 中的页码（可附条款编号）
      placeholder: 例如 第 12 页，10.2.3
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: 例如 2.5.4
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已对照标准原文核对，上面的写法和页码来自标准，而不是凭记忆
          required: true
